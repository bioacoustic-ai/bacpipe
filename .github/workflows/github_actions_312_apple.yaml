name: Model Testing Pipeline

on: [push, pull_request]

jobs:
  discover-models:
    name: Discover model list
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    outputs:
      models: ${{ steps.get-models.outputs.models }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find constants.py (debug)
        run: find . -name "constants.py"

      - name: Extract model names
        id: get-models
        run: |
          python -c "
          import ast, json, sys
          with open('bacpipe/core/constants.py') as f:
              tree = ast.parse(f.read())
          found = False
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if getattr(target, 'id', None) == 'EMBEDDING_DIMENSIONS':
                          keys = [k.value for k in node.value.keys]
                          print(json.dumps(keys))
                          found = True
          if not found:
              print('ERROR: EMBEDDING_DIMENSIONS not found', file=sys.stderr)
              sys.exit(1)
          " > models.json
          cat models.json
          echo "models=$(cat models.json)" >> "$GITHUB_OUTPUT"

  test-models:
    needs: discover-models
    name: ${{ matrix.model }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # Guarantees identical execution across Linux, Mac, and Windows
    strategy:
      fail-fast: false  # Ensures all OS/model combinations finish even if one fails
      matrix:
        os: [macos-latest]
        model: ${{ fromJson(needs.discover-models.outputs.models) }}

    steps:
      # 1. Clone repository code
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. Set up Python 3.11 with PIP caching enabled
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # Caches PyPI packages to make re-runs blazingly fast

      # 3. Install pytest and bacpipe source package
      - name: Install pytest and bacpipe (editable)
        run: pip install -r requirements_no_cuda.txt

      # 4. Run pytest specifically for the current matrix model
      - name: Run Embedding Creation Test
        run: >-
          python -m pytest -v --disable-warnings bacpipe/tests/test_embedding_creation.py
          --models=${{ matrix.model }}
          --only_embed_annotations=False
          --device=cpu

      # 5. Run embedding creation tests (only_embed_annotations=True)
      - name: Run Embedding Creation Tests (Annotations Only)
        run: >-
          python -m pytest -v --disable-warnings bacpipe/tests/test_embedding_creation.py
          --models=${{ matrix.model }}
          --only_embed_annotations=True
          --device=cpu

  # ---------------------------------------------------------------------------
  # Unit tests that do NOT need to generate model embeddings. These run once
  # (in parallel with the per-model jobs) because conftest.py only parametrizes
  # tests that request the `model`/`device` fixtures, i.e. test_embedding_creation.py.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (no model embeddings)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash  # Guarantees identical execution across Linux, Mac, and Windows
    steps:
      # 1. Clone repository code
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. Set up Python 3.12 with PIP caching enabled
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # Caches PyPI packages to make re-runs blazingly fast

      # 3. Install pytest and bacpipe source package
      - name: Install pytest and bacpipe (editable)
        run: pip install -r requirements_no_cuda.txt

      # 4. Run all unit tests that do NOT require generating model embeddings.
      - name: Run Unit Tests
        run: >-
          python -m pytest -q --disable-warnings bacpipe/tests/
          --ignore=bacpipe/tests/test_embedding_creation.py
