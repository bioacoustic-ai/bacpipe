name: Explore-GitHub-Actions

on: [push]

jobs:
  explore:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # Ensures multi-line bash commands run identically on Windows, Mac, and Linux
    strategy:
      fail-fast: false  # Allows all OS runs to finish even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # 1. Clone repository code
      - name: Check out repository code
        uses: actions/checkout@v6

      # 2. Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 3. Install requirements
      #- name: Install dependencies from requirements
      #  run: pip install -r requirements-no-tf.txt

      # 4. Install Pytest and bacpipe package
      - name: Install pytest and bacpipe (editable)
        run: |
          pip install -e .

      # 5. Run embedding creation tests (only_embed_annotations=False)
      - name: Run Embedding Creation Tests (Full)
        run: >-
          python -m pytest -v --disable-warnings bacpipe/tests/test_embedding_creation.py
          --models=avesecho_passt,birdnet,perch_v2,naturebeats
          --only_embed_annotations=False
          --device=cpu

      # 6. Run embedding creation tests (only_embed_annotations=True)
      - name: Run Embedding Creation Tests (Annotations Only)
        run: >-
          python -m pytest -v --disable-warnings bacpipe/tests/test_embedding_creation.py
          --models=avesecho_passt,birdmae,naturebeats
          --only_embed_annotations=True
          --device=cpu
