[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/bacpipe",
    "src",
    "run_pipeline.py"
]
exclude = [
    "*.png",
    "*.gif",
    "*.jpg",
    "*.jpeg",
    "bacpipe.egg-info",
    "bacpipe/model_checkpoints",
    "bacpipe/examples"
]


[tool.hatch.build.targets.sdist]
include = [
    "/bacpipe",
    "src",
    "run_pipeline.py"
]
exclude = [
    "*.png",
    "*.gif",
    "*.jpg",
    "*.jpeg",
    "bacpipe.egg-info",
    "bacpipe/model_checkpoints",
    "bacpipe/examples"

]

[tool.black]
line-length = 79