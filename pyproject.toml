[project]
name = "bacpipe"
version = "1.3.5"
description = "Use bacpipe to streamline the process of generating embeddings and analysing your PAM datasets."
readme = "README.md"
authors = [
    { name = "Vincent S. Kather", email = "vkather@gmail.com" }
]
requires-python = ">=3.11, <3.13"

dependencies = [
    # --- Core Audio & Evaluation Stack ---
    "numpy>=1.26, <2.0.0",
    "pandas>=2.2, <3.0.0",
    "scipy>=1.13, <2.0.0",
    "scikit-learn>=1.7, <2.0.0",
    "librosa>=0.11.0, <1.0.0",
    "soundfile>=0.12.1",
    "audioread>=3.0.1",
    "matplotlib>=3.10, <4.0.0",
    "seaborn>=0.13.2, <1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "umap-learn>=0.5.12, <0.6.0",
    "sounddevice>=0.5",
    "pyarrow>=15.0, <26.0.0",
    "fastparquet>=2024.11.0",
    "huggingface-hub>=0.34.4",
    "ijson>=3.2",
    "paramiko>=3.4",

    # --- PyTorch Ecosystem ---
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "timm==1.0.11",
    "transformers>=4.56.0, <5.0.0",
    "einops>=0.8.0",
    "onnxruntime>=1.26.0, <1.29.0; sys_platform != 'linux'",

    # --- TensorFlow & JAX Ecosystem ---
    "tensorflow==2.20.0; sys_platform != 'win32'",
    "tensorflow==2.15.1; sys_platform == 'win32'",
    "tensorflow-hub>=0.16.0, <0.17.0; sys_platform != 'win32'",
    "ml-collections>=0.1.1, <2.0.0",
    "kagglehub>=0.3.13, <2.0.0",
    "keras>=3.11.0, <3.12.0; sys_platform != 'win32'",
    "jax>=0.4.33, <0.5.0",
    "jaxlib>=0.4.33, <0.5.0",
    "flax>=0.10.0, <0.11.0",

    # --- Plotting and testing ---
    "panel>=1.6.2, <2.0.0",
    "plotly>=6.6.0, <8.0.0",
    "kaleido>=1.0.0, <2.0.0",
    "pytest>=8.0",

    # --- Bioacoustic Packages ---
    "batdetect2==1.3.1",
    "hear21passt==0.0.26",

    # --- Linux CUDA & Acceleration Drivers ---
    "nvidia-cublas-cu12==12.4.5.8; sys_platform == 'linux'",
    "nvidia-cuda-cupti-cu12==12.4.127; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12==12.4.127; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12==12.4.127; sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.1.0.70; sys_platform == 'linux'",
    "nvidia-cufft-cu12==11.2.1.3; sys_platform == 'linux'",
    "nvidia-curand-cu12==10.3.5.147; sys_platform == 'linux'",
    "nvidia-cusolver-cu12==11.6.1.9; sys_platform == 'linux'",
    "nvidia-cusparse-cu12==12.3.1.170; sys_platform == 'linux'",
    "nvidia-cusparselt-cu12==0.6.2; sys_platform == 'linux'",
    "nvidia-nccl-cu12==2.21.5; sys_platform == 'linux'",
    "nvidia-nvjitlink-cu12==12.4.127; sys_platform == 'linux'",
    "nvidia-nvtx-cu12==12.4.127; sys_platform == 'linux'",
    "onnxruntime-gpu>=1.26.0, <1.27.0; sys_platform == 'linux'",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/bacpipe",
    "run_pipeline.py",
    "/bacpipe/imgs/bacpipe_favicon_white.png",
    "/bacpipe/imgs/bacpipe_unlabelled.png"
]
exclude = [
    "*.gif",
    "*.jpg",
    "*.jpeg",
    "bacpipe.egg-info",
    "bacpipe/model_checkpoints",
    "bacpipe/examples"
]

[tool.hatch.build.targets.sdist]
include = [
    "/bacpipe",
    "run_pipeline.py",
    "/bacpipe/imgs/bacpipe_favicon_white.png",
    "/bacpipe/imgs/bacpipe_unlabelled.png"
]
exclude = [
    "*.gif",
    "*.jpg",
    "*.jpeg",
    "bacpipe.egg-info",
    "bacpipe/model_checkpoints",
    "bacpipe/examples"
]

[tool.black]
line-length = 79