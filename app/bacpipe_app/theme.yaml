# ---------------------------------------------------------------------------
# Colors and font sizes of the bacpipe application.
#
# Change a value, save, and start the application again
# (python app/run_app.py). Colors are hex codes, for example from
# https://htmlcolorcodes.com/color-picker/ . Keep the quotation marks.
# ---------------------------------------------------------------------------

# the terminal that shows the output of the pipeline
terminal:
  background: "#1b1f3b"   # dark blue, like the squares in the tartan
  text: "#f0ff66"         # yellow, like the stripes in the tartan
  font_size: 16           # in pixels
  height: 600             # in pixels

# the help texts below the fields of the configuration and settings pages
help_text:
  color: "#333841"
  font_size: "1em"        # 1em = the same size as the labels and inputs

# the "Play the bacpipe" button
play_button:
  font_size: "2.7em"
  icon_size: "68px"
  width: 480              # in pixels
  height: 88              # in pixels
